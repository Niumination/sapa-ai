  <path d="M28 53.5 q4 -3 8 0 t8 0 t8 0" fill="none" stroke="#7FB5A8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M14 57 q4 -3 8 0 t8 0 t8 0" fill="none" stroke="#D4A853" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
