name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sengaja tidak memakai satu pun secrets: aplikasi harus berjalan penuh tanpa
# env var apa pun (100% deterministik dari data SAPA SPLP). Kalau CI ini perlu
# kredensial, itu berarti ada yang salah pada desainnya.

jobs:
  fondasi:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
